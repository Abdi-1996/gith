name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository files:"
          find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort | head -300

          PROJECT_YML="$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name project.yml -print -quit || true)"
          WORKSPACE="$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type d -name '*.xcworkspace' -print -quit || true)"
          XCODEPROJ="$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type d -name '*.xcodeproj' -print -quit || true)"

          if [ -n "$PROJECT_YML" ]; then
            echo "PROJECT_TYPE=xcodegen" >> "$GITHUB_ENV"
            echo "PROJECT_DIR=$(dirname "$PROJECT_YML")" >> "$GITHUB_ENV"
            echo "Found project.yml: $PROJECT_YML"

          elif [ -n "$WORKSPACE" ]; then
            echo "PROJECT_TYPE=workspace" >> "$GITHUB_ENV"
            echo "PROJECT_PATH=$WORKSPACE" >> "$GITHUB_ENV"
            echo "PROJECT_DIR=$(dirname "$WORKSPACE")" >> "$GITHUB_ENV"
            echo "Found workspace: $WORKSPACE"

          elif [ -n "$XCODEPROJ" ]; then
            echo "PROJECT_TYPE=project" >> "$GITHUB_ENV"
            echo "PROJECT_PATH=$XCODEPROJ" >> "$GITHUB_ENV"
            echo "PROJECT_DIR=$(dirname "$XCODEPROJ")" >> "$GITHUB_ENV"
            echo "Found project: $XCODEPROJ"

          else
            echo "ERROR: No project.yml, .xcworkspace, or .xcodeproj found"
            exit 1
          fi

      - name: Install XcodeGen
        if: env.PROJECT_TYPE == 'xcodegen'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        if: env.PROJECT_TYPE == 'xcodegen'
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcodegen generate

          GENERATED="$(find "$PROJECT_DIR" -maxdepth 1 -type d -name '*.xcodeproj' -print -quit)"
          if [ -z "$GENERATED" ]; then
            echo "ERROR: xcodegen did not generate .xcodeproj"
            exit 1
          fi

          echo "PROJECT_TYPE=project" >> "$GITHUB_ENV"
          echo "PROJECT_PATH=$GENERATED" >> "$GITHUB_ENV"
          echo "Generated project: $GENERATED"

      - name: Detect scheme
        shell: bash
        run: |
          set -euo pipefail

          if [ "$PROJECT_TYPE" = "workspace" ]; then
            JSON="$(xcodebuild -list -json -workspace "$PROJECT_PATH")"
          else
            JSON="$(xcodebuild -list -json -project "$PROJECT_PATH")"
          fi

          echo "$JSON"

          SCHEME="$(printf '%s' "$JSON" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("workspace") or d.get("project") or {}; s=r.get("schemes",[]); print(s[0] if s else "")')"

          if [ -z "$SCHEME" ]; then
            echo "ERROR: No shared scheme found"
            exit 1
          fi

          echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          echo "Using scheme: $SCHEME"

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euo pipefail

          if [ "$PROJECT_TYPE" = "workspace" ]; then
            xcodebuild               -resolvePackageDependencies               -workspace "$PROJECT_PATH"               -scheme "$SCHEME"
          else
            xcodebuild               -resolvePackageDependencies               -project "$PROJECT_PATH"               -scheme "$SCHEME"
          fi

      - name: Build unsigned app
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail

          if [ "$PROJECT_TYPE" = "workspace" ]; then
            xcodebuild               -workspace "$PROJECT_PATH"               -scheme "$SCHEME"               -configuration Release               -sdk iphoneos               -destination "generic/platform=iOS"               -derivedDataPath "$RUNNER_TEMP/DerivedData"               CODE_SIGNING_ALLOWED=NO               CODE_SIGNING_REQUIRED=NO               CODE_SIGN_IDENTITY=""               DEVELOPMENT_TEAM=""               clean build
          else
            xcodebuild               -project "$PROJECT_PATH"               -scheme "$SCHEME"               -configuration Release               -sdk iphoneos               -destination "generic/platform=iOS"               -derivedDataPath "$RUNNER_TEMP/DerivedData"               CODE_SIGNING_ALLOWED=NO               CODE_SIGNING_REQUIRED=NO               CODE_SIGN_IDENTITY=""               DEVELOPMENT_TEAM=""               clean build
          fi

      - name: Create IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: built .app not found"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 4 -type d -print || true
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"

          cd "$RUNNER_TEMP"
          rm -f BuiltApp.ipa
          /usr/bin/zip -qry BuiltApp.ipa Payload

          test -s BuiltApp.ipa
          unzip -t BuiltApp.ipa >/dev/null
          ls -lh BuiltApp.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Built-IPA
          path: ${{ runner.temp }}/BuiltApp.ipa
          if-no-files-found: error
          retention-days: 14
